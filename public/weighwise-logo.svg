<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" fill="none">
  <defs>
    <!-- Teal-to-Navy Gradient matching exact WeighWise brand colors -->
    <linearGradient id="wwGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#149A9B" />
      <stop offset="35%" stop-color="#0E7896" />
      <stop offset="70%" stop-color="#0F5682" />
      <stop offset="100%" stop-color="#0E3C66" />
    </linearGradient>
    
    <linearGradient id="wwGradHorizontal" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#149A9B" />
      <stop offset="100%" stop-color="#0E4875" />
    </linearGradient>

    <!-- Subtle gradient for metrology weight standard -->
    <linearGradient id="weightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#108092" />
      <stop offset="100%" stop-color="#0A3254" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0e3c66" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- EMBLEM GRAPHIC -->
  <g filter="url(#subtleGlow)" transform="translate(60, 16)">
    <!-- Outer Metrology Compass Ring -->
    <circle 
      cx="100" 
      cy="100" 
      r="78" 
      stroke="url(#wwGrad)" 
      stroke-width="13" 
      stroke-linecap="round" 
    />

    <!-- Vertical Top Fulcrum Stem (T-Axis) -->
    <line 
      x1="100" 
      y1="23" 
      x2="100" 
      y2="76" 
      stroke="url(#wwGrad)" 
      stroke-width="12" 
      stroke-linecap="round" 
    />

    <!-- Interlocking Double-W Curved Ribbon System -->
    <!-- Left W Wing -->
    <path 
      d="M 52 70 
         C 50 94, 60 120, 78 126 
         C 90 130, 99 116, 107 100 
         C 116 82, 126 62, 142 66 
         C 152 69, 153 84, 149 98" 
      stroke="url(#wwGrad)" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none" 
    />

    <!-- Right W Wing (Intertwined) -->
    <path 
      d="M 148 70 
         C 150 94, 140 120, 122 126 
         C 110 130, 101 116, 93 100 
         C 84 82, 74 62, 58 66 
         C 48 69, 47 84, 51 98" 
      stroke="url(#wwGrad)" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none" 
    />

    <!-- Lower Central Arch Support -->
    <path 
      d="M 64 120 
         C 78 136, 122 136, 136 120" 
      stroke="url(#wwGrad)" 
      stroke-width="10" 
      stroke-linecap="round" 
      fill="none" 
    />

    <!-- Precision OIML Calibration Weight (Silhouette at 6 o'clock) -->
    <!-- Knob Handle -->
    <rect x="94" y="140" width="12" height="6" rx="2" fill="url(#weightGrad)" />
    <!-- Weight Neck -->
    <rect x="96" y="146" width="8" height="4" fill="url(#weightGrad)" />
    <!-- Weight Body & Beveled Shoulder -->
    <path 
      d="M 91 150 
         L 109 150 
         L 112 154 
         L 112 178 
         L 88 178 
         L 88 154 
         Z" 
      fill="url(#weightGrad)" 
    />
  </g>

  <!-- TYPOGRAPHY: WEIGHWISE -->
  <text 
    x="160" 
    y="282" 
    text-anchor="middle" 
    fill="#0E3D61" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
    font-size="34" 
    font-weight="800" 
    letter-spacing="2.5"
  >
    WEIGHWISE
  </text>

  <!-- SUBTITLE: METROLOGY COMPLIANCE -->
  <text 
    x="160" 
    y="310" 
    text-anchor="middle" 
    fill="#164E63" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
    font-size="13.5" 
    font-weight="600" 
    letter-spacing="4.5"
  >
    METROLOGY COMPLIANCE
  </text>
</svg>
