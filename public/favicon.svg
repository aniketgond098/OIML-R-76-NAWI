<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="wwFaviconGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#149A9B" />
      <stop offset="35%" stop-color="#0E7896" />
      <stop offset="70%" stop-color="#0F5682" />
      <stop offset="100%" stop-color="#0E3C66" />
    </linearGradient>
    <linearGradient id="favWeightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#108092" />
      <stop offset="100%" stop-color="#0A3254" />
    </linearGradient>
  </defs>

  <!-- Background Soft Circle for high contrast on light/dark browser tabs -->
  <circle cx="100" cy="100" r="96" fill="#F8FAFC" />

  <!-- Outer Metrology Compass Ring -->
  <circle 
    cx="100" 
    cy="100" 
    r="78" 
    stroke="url(#wwFaviconGrad)" 
    stroke-width="14" 
    stroke-linecap="round" 
  />

  <!-- Vertical Top Fulcrum Stem (T-Axis) -->
  <line 
    x1="100" 
    y1="23" 
    x2="100" 
    y2="76" 
    stroke="url(#wwFaviconGrad)" 
    stroke-width="13" 
    stroke-linecap="round" 
  />

  <!-- Interlocking Double-W Curved Ribbon System -->
  <!-- Left W Wing -->
  <path 
    d="M 52 70 
       C 50 94, 60 120, 78 126 
       C 90 130, 99 116, 107 100 
       C 116 82, 126 62, 142 66 
       C 152 69, 153 84, 149 98" 
    stroke="url(#wwFaviconGrad)" 
    stroke-width="13" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none" 
  />

  <!-- Right W Wing (Intertwined) -->
  <path 
    d="M 148 70 
       C 150 94, 140 120, 122 126 
       C 110 130, 101 116, 93 100 
       C 84 82, 74 62, 58 66 
       C 48 69, 47 84, 51 98" 
    stroke="url(#wwFaviconGrad)" 
    stroke-width="13" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none" 
  />

  <!-- Lower Central Arch Support -->
  <path 
    d="M 64 120 
       C 78 136, 122 136, 136 120" 
    stroke="url(#wwFaviconGrad)" 
    stroke-width="11" 
    stroke-linecap="round" 
    fill="none" 
  />

  <!-- Calibration Weight at 6 o'clock -->
  <rect x="94" y="140" width="12" height="6" rx="2" fill="url(#favWeightGrad)" />
  <rect x="96" y="146" width="8" height="4" fill="url(#favWeightGrad)" />
  <path 
    d="M 91 150 
       L 109 150 
       L 112 154 
       L 112 178 
       L 88 178 
       L 88 154 
       Z" 
    fill="url(#favWeightGrad)" 
  />
</svg>
