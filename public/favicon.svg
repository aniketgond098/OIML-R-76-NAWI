<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#grad1)" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="32" cy="32" r="24" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Central Fulcrum & Pillar -->
  <rect x="30.5" y="18" width="3" height="28" rx="1.5" fill="#FFFFFF" />
  <circle cx="32" cy="18" r="3.5" fill="#38BDF8" />
  
  <!-- Precision Balance Beam -->
  <path d="M14 22 L50 22" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  
  <!-- Left Pan Suspension & Pan -->
  <path d="M16 22 L11 36 M16 22 L21 36" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M9 36 Q16 41 23 36 Z" fill="url(#gold)" stroke="#38BDF8" stroke-width="1" />
  
  <!-- Right Pan Suspension & Pan -->
  <path d="M48 22 L43 36 M48 22 L53 36" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M41 36 Q48 41 55 36 Z" fill="url(#gold)" stroke="#38BDF8" stroke-width="1" />
  
  <!-- Heavy Base -->
  <path d="M22 47 L42 47" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <path d="M18 50 L46 50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
</svg>
